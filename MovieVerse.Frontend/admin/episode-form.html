<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>Episode Editor • MovieVerse</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-square.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/variables.css" rel="stylesheet">
  <link href="../css/main.css" rel="stylesheet">
  <link href="../css/components.css" rel="stylesheet">
  <link href="../css/pages.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head><body class="mv-admin-body" ><div class="mv-admin-shell"><aside id="adminSidebar" class="mv-admin-sidebar"></aside><div class="mv-admin-main"><header id="adminTopbar" class="mv-admin-topbar"></header><main class="mv-admin-content"><div class="d-flex justify-content-between align-items-center mb-3"><div><div class="mv-kicker">Episode editor</div><h1 id="episodeFormTitle" class="h2 mv-page-title mb-0">Episode</h1></div><a class="btn btn-secondary" href="tvshows.html">TV Shows</a></div><form id="episodeForm" novalidate enctype="multipart/form-data"><section class="mv-admin-form-section"><h3>Basic information</h3><div class="row g-3"><div class="col-md-8"><label class="form-label" for="Title">Title</label><input class="form-control" id="Title" name="Title" maxlength="300"></div><div class="col-md-4"><label class="form-label" for="EpisodeNumber">Episode number</label><input class="form-control" id="EpisodeNumber" name="EpisodeNumber" type="number" min="1"></div><div class="col-md-4"><label class="form-label" for="ReleaseDate">Release date</label><input class="form-control" id="ReleaseDate" name="ReleaseDate" type="date"></div><div class="col-md-4"><label class="form-label" for="RuntimeMinutes">Runtime (minutes)</label><input class="form-control" id="RuntimeMinutes" name="RuntimeMinutes" type="number" min="1"></div><div class="col-12"><label class="form-label" for="Description">Description</label><textarea class="form-control" id="Description" name="Description" rows="4"></textarea></div></div></section><section class="mv-admin-form-section"><h3>Episode image</h3><div class="row g-3"><div class="col-md-8"><input class="form-control" id="Image" name="Image" type="file" accept="image/*"><div class="form-text text-secondary">Image files only, maximum 5 MB.</div></div><div class="col-md-4"><img id="episodePreview" class="mv-image-preview" src="../assets/images/placeholder.svg" alt="Episode preview"></div></div></section><section class="mv-admin-form-section"><h3>Cast & crew</h3><div class="row g-4"><div class="col-12"><label class="form-label">Actors</label><div id="episodeActors"></div></div><div class="col-md-6"><label class="form-label">Directors</label><div id="episodeDirectors"></div></div><div class="col-md-6"><label class="form-label">Writers</label><div id="episodeWriters"></div></div></div></section><div class="d-flex justify-content-end gap-2"><a class="btn btn-secondary" href="tvshows.html">Cancel</a><button class="btn btn-primary" id="saveEpisode" type="submit">Save episode</button></div></form></main></div></div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/admin/admin-common.js"></script>
  <script src="../js/admin/episode-form.js"></script>
</body></html>
