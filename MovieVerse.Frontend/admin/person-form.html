<head>

</head><body class="mv-admin-body" ><div class="mv-admin-shell"><aside id="adminSidebar" class="mv-admin-sidebar"></aside><div class="mv-admin-main"><header id="adminTopbar" class="mv-admin-topbar"></header><main class="mv-admin-content"><div class="d-flex justify-content-between align-items-center mb-3"><div><div class="mv-kicker">People editor</div><h1 id="personFormTitle" class="h2 mv-page-title mb-0">Person</h1></div><a class="btn btn-secondary" id="personBackLink" href="actors.html">People</a></div><form id="personForm" novalidate enctype="multipart/form-data"><section class="mv-admin-form-section"><h3>Basic information</h3><div class="row g-3"><div class="col-md-8"><label class="form-label" for="FullName">Full name</label><input class="form-control" id="FullName" name="FullName" maxlength="200"></div><div class="col-md-4"><label class="form-label" for="HeightInMeters">Height (meters)</label><input class="form-control" id="HeightInMeters" name="HeightInMeters" type="number" min="0.01" step="0.01"></div><div class="col-md-6"><label class="form-label" for="BirthDate">Birth date</label><input class="form-control" id="BirthDate" name="BirthDate" type="date"></div><div class="col-md-6"><label class="form-label" for="BirthPlace">Birth place</label><input class="form-control" id="BirthPlace" name="BirthPlace"></div><div class="col-md-6"><label class="form-label" for="DeathDate">Death date</label><input class="form-control" id="DeathDate" name="DeathDate" type="date"></div><div class="col-md-6"><label class="form-label" for="DeathPlace">Death place</label><input class="form-control" id="DeathPlace" name="DeathPlace"></div></div></section><section class="mv-admin-form-section"><h3>Biography & image</h3><div class="row g-3"><div class="col-lg-8"><label class="form-label" for="Biography">Biography</label><textarea class="form-control" id="Biography" name="Biography" rows="6"></textarea><label class="form-label mt-3" for="ProfileImage">Profile image</label><input class="form-control" id="ProfileImage" name="ProfileImage" type="file" accept="image/*"><div class="form-text text-secondary">Image files only, maximum 5 MB.</div></div><div class="col-lg-4"><img id="personPreview" class="mv-image-preview" src="../assets/images/placeholder.svg" alt="Profile image preview"></div></div></section><section class="mv-admin-form-section"><h3>Personal details</h3><div class="row g-3"><div class="col-md-6"><label class="form-label" for="AlternativeName">Alternative name</label><input class="form-control" id="AlternativeName" name="AlternativeName"></div><div class="col-md-6"><label class="form-label" for="Nickname">Nickname</label><input class="form-control" id="Nickname" name="Nickname"></div></div></section><section class="mv-admin-form-section"><h3>Family</h3><div class="row g-3"><div class="col-md-6"><label class="form-label" for="Spouse">Spouse</label><input class="form-control" id="Spouse" name="Spouse"></div><div class="col-md-6"><label class="form-label" for="Children">Children</label><input class="form-control" id="Children" name="Children"></div><div class="col-md-6"><label class="form-label" for="Parents">Parents</label><textarea class="form-control" id="Parents" name="Parents" rows="2"></textarea></div><div class="col-md-6"><label class="form-label" for="Relatives">Relatives</label><textarea class="form-control" id="Relatives" name="Relatives" rows="2"></textarea></div></div></section><section class="mv-admin-form-section"><h3>Career / trivia</h3><div class="row g-3"><div class="col-12"><label class="form-label" for="OtherWorks">Other works</label><textarea class="form-control" id="OtherWorks" name="OtherWorks" rows="3"></textarea></div><div class="col-12"><label class="form-label" for="Trivia">Trivia</label><textarea class="form-control" id="Trivia" name="Trivia" rows="3"></textarea></div><div class="col-12"><label class="form-label" for="Quote">Quote</label><textarea class="form-control" id="Quote" name="Quote" rows="3"></textarea></div><div class="col-12"><label class="form-label" for="Trademark">Trademark</label><textarea class="form-control" id="Trademark" name="Trademark" rows="3"></textarea></div></div></section><div class="d-flex justify-content-end gap-2"><button class="btn btn-primary" id="savePerson" type="submit">Save <span class="js-person-label">Person</span></button></div></form></main></div></div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/admin/admin-common.js"></script>
  <script src="../js/admin/person-form.js"></script>
</body></html>
