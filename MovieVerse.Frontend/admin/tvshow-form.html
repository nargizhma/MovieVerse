<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>TV Show Editor • MovieVerse</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-square.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/variables.css" rel="stylesheet">
  <link href="../css/main.css" rel="stylesheet">
  <link href="../css/components.css" rel="stylesheet">
  <link href="../css/pages.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head><body class="mv-admin-body" ><div class="mv-admin-shell"><aside id="adminSidebar" class="mv-admin-sidebar"></aside><div class="mv-admin-main"><header id="adminTopbar" class="mv-admin-topbar"></header><main class="mv-admin-content"><div class="d-flex justify-content-between align-items-center mb-3"><div><div class="mv-kicker">TV editor</div><h1 id="tvshowFormTitle" class="h2 mv-page-title mb-0">Create TV Show</h1></div><a class="btn btn-secondary" href="tvshows.html">Back</a></div><form id="tvshowForm" novalidate enctype="multipart/form-data">
<section class="mv-admin-form-section"><h3>Basic information</h3><div class="row g-3"><div class="col-md-6"><label class="form-label" for="Title">Title</label><input class="form-control" id="Title" name="Title" maxlength="300"></div><div class="col-md-6"><label class="form-label" for="OriginalTitle">Original title</label><input class="form-control" id="OriginalTitle" name="OriginalTitle" maxlength="300"></div><div class="col-md-4"><label class="form-label" for="ReleaseDate">Release date</label><input class="form-control" id="ReleaseDate" name="ReleaseDate" type="date"></div><div class="col-md-4"><label class="form-label" for="EndDate">End date</label><input class="form-control" id="EndDate" name="EndDate" type="date"></div><div class="col-md-2"><label class="form-label" for="ContentRating">Content rating</label><input class="form-control" id="ContentRating" name="ContentRating"></div><div class="col-md-2"><label class="form-label" for="RuntimeMinutes">Runtime</label><input class="form-control" id="RuntimeMinutes" name="RuntimeMinutes" type="number" min="1"></div><div class="col-12"><label class="form-label" for="Synopsis">Synopsis</label><textarea class="form-control" id="Synopsis" name="Synopsis" rows="4"></textarea></div></div></section>
<section class="mv-admin-form-section"><h3>Media</h3><div class="row g-3"><div class="col-lg-8"><label class="form-label" for="PosterImage">Poster image</label><input class="form-control" id="PosterImage" name="PosterImage" type="file" accept="image/*"><div class="form-text text-secondary">Image files only, maximum 5 MB.</div><label class="form-label mt-3" for="TrailerUrl">Trailer URL</label><input class="form-control" id="TrailerUrl" name="TrailerUrl" type="url"></div><div class="col-lg-4"><img id="posterPreview" class="mv-image-preview" src="../assets/images/placeholder.svg" alt="Poster preview"></div></div></section>
<section class="mv-admin-form-section"><h3>Details</h3><div class="row g-3"><div class="col-12"><label class="form-label" for="Storyline">Storyline</label><textarea class="form-control" id="Storyline" name="Storyline" rows="4"></textarea></div><div class="col-md-6"><label class="form-label" for="OriginalLanguage">Original language</label><input class="form-control" id="OriginalLanguage" name="OriginalLanguage"></div><div class="col-md-6"><label class="form-label" for="CountryOfOrigin">Country of origin</label><input class="form-control" id="CountryOfOrigin" name="CountryOfOrigin"></div><div class="col-md-6"><label class="form-label" for="ProductionCompany">Production company</label><input class="form-control" id="ProductionCompany" name="ProductionCompany"></div><div class="col-md-6"><label class="form-label" for="Color">Color</label><input class="form-control" id="Color" name="Color"></div><div class="col-12"><label class="form-label" for="Trivia">Trivia</label><textarea class="form-control" id="Trivia" name="Trivia" rows="3"></textarea></div></div></section>
<section class="mv-admin-form-section"><h3>Cast</h3><div class="row g-4"><div class="col-md-6"><label class="form-label">Genres</label><div id="tvGenres"></div></div><div class="col-12"><label class="form-label">Actors</label><div id="tvActors"></div></div></div></section><div class="d-flex gap-2 justify-content-end"><a class="btn btn-secondary" href="tvshows.html">Cancel</a><button class="btn btn-primary" id="saveTvShow" type="submit">Save TV show</button></div></form>
<section id="seasonManagement" class="mv-admin-form-section mt-4 d-none"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"><div><div class="mv-kicker">Structure</div><h2 class="h4 mb-0">Seasons & Episodes</h2></div><form id="addSeasonForm" class="d-flex gap-2"><input class="form-control" name="SeasonNumber" type="number" min="1" placeholder="Season #" style="width:130px" required><button class="btn btn-primary" type="submit"><i class="fa-solid fa-plus me-1"></i>Add Season</button></form></div><div id="seasonList"></div></section></main></div></div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/admin/admin-common.js"></script>
  <script src="../js/admin/tvshow-form.js"></script>
</body></html>
