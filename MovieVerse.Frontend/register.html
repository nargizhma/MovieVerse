<main class="mv-auth-page"><section class="mv-auth-brand"><a href="index.html"><img src="assets/images/logo-horizontal.png" alt="MovieVerse"></a><h1>Build your own MovieVerse.</h1><p class="text-secondary">Create an account to keep ratings, reviews, watchlist and watched titles in one place.</p></section><section class="mv-auth-form-shell"><div class="mv-auth-card"><div class="mv-kicker">Create account</div><h2 class="mb-3">Register</h2><div id="registerError"></div><form id="registerForm" method="post" novalidate><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email"></div><div class="mb-3"><label class="form-label" for="userName">Username</label><input class="form-control" id="userName" name="userName" autocomplete="username"></div><div class="mb-3"><label class="form-label" for="displayName">Display Name <span class="text-secondary fw-normal">(optional)</span></label><input class="form-control" id="displayName" name="displayName"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password"><div class="form-text text-secondary">At least 6 characters with uppercase, lowercase, digit and special character.</div></div><div class="mb-3"><label class="form-label" for="confirmPassword">Confirm Password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"></div><button class="btn btn-primary w-100" id="registerSubmit" type="submit">Create account</button></form><p class="text-secondary mt-3 mb-0">Already registered? <a href="login.html">Login</a></p></div></section></main>
