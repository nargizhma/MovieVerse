<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <meta
    name="theme-color"
    content="#070b12">

  <title>Preparing Report • MovieVerse</title>

  <link
    rel="icon"
    type="image/png"
    href="assets/images/logo-square.png">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    rel="stylesheet">

  <link
    href="css/variables.css"
    rel="stylesheet">

  <link
    href="css/main.css"
    rel="stylesheet">

  <link
    href="css/components.css"
    rel="stylesheet">


  <style>

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #070b12;

      padding: 1.5rem;
    }


    .mv-report-success-card {
      width: 100%;
      max-width: 520px;

      padding: 2.5rem;

      text-align: center;

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);
    }


    .mv-report-success-logo {
      width: 180px;
      max-width: 70%;

      margin-bottom: 2rem;
    }


    .mv-report-success-icon {
      width: 70px;
      height: 70px;

      display: grid;
      place-items: center;

      margin:
        0 auto
        1.25rem;

      border-radius: 50%;

      background:
        var(--accent-soft);

      color:
        var(--accent);

      font-size:
        1.7rem;
    }


    .mv-report-success-card h1 {
      margin-bottom: .75rem;

      color:
        var(--text-primary);

      font-size:
        1.6rem;
    }


    .mv-report-success-card p {
      margin-bottom: 0;

      color:
        var(--text-secondary);

      line-height:
        1.6;
    }


    .mv-report-success-loader {
      margin-top: 1.5rem;
    }


    .mv-report-success-error {
      display: none;

      margin-top: 1.5rem;
    }


    .mv-report-success-actions {
      display: none;

      margin-top: 1.5rem;
    }

  </style>

</head>


<body>

  <main
    class="mv-report-success-card">


    <img
      class="mv-report-success-logo"
      src="assets/images/logo-horizontal.png"
      alt="MovieVerse">


    <div
      class="mv-report-success-icon"
      id="reportStatusIcon">

      <i class="fa-solid fa-receipt"></i>

    </div>


    <h1 id="reportStatusTitle">
      Confirming your payment
    </h1>


    <p id="reportStatusMessage">

      MovieVerse is verifying your Stripe
      payment. Your report will open
      automatically when it is ready.

    </p>


    <div
      class="mv-report-success-loader"
      id="reportLoader">

      <div
        class="spinner-border text-info"
        role="status">

        <span class="visually-hidden">
          Loading...
        </span>

      </div>

    </div>


    <div
      class="alert alert-danger mv-report-success-error"
      id="reportError">
    </div>


    <div
      class="mv-report-success-actions"
      id="reportActions">

      <a
        href="profile.html"
        class="btn btn-outline-primary">

        <i
          class="fa-solid fa-arrow-left me-2">
        </i>

        Return to MovieVerse

      </a>

    </div>


  </main>


  <!-- Your normal MovieVerse core scripts -->

  <script src="js/config.js"></script>

  <script
    src="js/api.js?v=20260906-backend-validation-1">
  </script>

  <script src="js/auth.js"></script>


  <!-- This page -->

  <script src="js/pages/report-success.js"></script>

</body>

</html>
